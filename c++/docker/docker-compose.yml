services:
  build:
    image: multimodal-detect-build
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      # Source + build artifacts (cmake incremental builds persist here)
      - ../:/workspace
      # ccache object cache (persists compiled objects across container restarts)
      - ccache:/ccache
    environment:
      - MAKEFLAGS=-j4
      - CCACHE_DIR=/ccache

volumes:
  ccache:
